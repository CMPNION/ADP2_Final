# Purpose: lightweight alert rules for the demo and PRR review.
groups:
  - name: platform-alerts
    rules:
      - alert: GatewayHighErrorRate
        expr: sum(rate(api_gateway_http_requests_total{status=~"5.."}[5m])) / sum(rate(api_gateway_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API gateway error rate is above 5%"
          description: "The gateway is returning too many 5xx responses."

      - alert: OrderServiceHighErrorRate
        expr: sum(rate(order_http_requests_total{status=~"5.."}[5m])) / sum(rate(order_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order service error rate is above 5%"
          description: "Order traffic is failing more often than expected."

      - alert: InventoryGrpcLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(inventory_grpc_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inventory p95 latency is above 500ms"
          description: "Inventory gRPC requests are slower than the demo SLO."

      - alert: ServiceDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "A monitored target is down"
          description: "Prometheus cannot scrape one of the monitored services."
