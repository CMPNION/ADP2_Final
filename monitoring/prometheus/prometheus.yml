# Purpose: scrape the service metrics endpoints and fire alerts into Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:9095']

  - job_name: inventory-service
    metrics_path: /metrics
    static_configs:
      - targets: ['inventory-service:9090']

  - job_name: catalog-service
    metrics_path: /metrics
    static_configs:
      - targets: ['catalog-service:8081']

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ['order-service:8082']

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:8090']

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-service:8083']
