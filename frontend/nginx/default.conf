server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /inventory/ {
        set $inventory_upstream http://api-gateway:8080;
        proxy_pass $inventory_upstream;
        proxy_http_version 1.1;
    }

    location /catalog/ {
        set $catalog_upstream http://api-gateway:8080;
        proxy_pass $catalog_upstream;
        proxy_http_version 1.1;
    }

    location /orders {
        set $orders_upstream http://api-gateway:8080;
        proxy_pass $orders_upstream;
        proxy_http_version 1.1;
    }

    location /orders/ {
        set $orders_upstream http://api-gateway:8080;
        proxy_pass $orders_upstream;
        proxy_http_version 1.1;
    }

    location /notifications/ {
        set $notifications_upstream http://api-gateway:8080;
        proxy_pass $notifications_upstream;
        proxy_http_version 1.1;
    }

    location /auth/ {
        set $auth_upstream http://auth-service:8090;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
    }
}
