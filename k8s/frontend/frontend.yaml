#
# Purpose: frontend deployment and service with nginx proxy config mounted from a ConfigMap.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: omnichannel
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
      }

      location /auth/ {
        proxy_pass http://auth-service:8090/auth/;
      }

      location /inventory/ {
        proxy_pass http://api-gateway:8080/inventory/;
      }

      location /catalog/ {
        proxy_pass http://api-gateway:8080/catalog/;
      }

      location /orders/ {
        proxy_pass http://api-gateway:8080/orders/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: omnichannel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/cmpnion/adp-final/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: omnichannel
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
