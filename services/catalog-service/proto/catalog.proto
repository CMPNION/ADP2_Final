syntax = "proto3";
package catalog;
option go_package = "omnichannel/proto/catalog;catalog";

message Product { string sku = 1; string name = 2; string description = 3; double price = 4; }
message CreateProductRequest { Product product = 1; }
message CreateProductResponse { string sku = 1; }
message GetProductRequest { string sku = 1; }
message GetProductResponse { Product product = 1; }
message SearchProductsRequest { string query = 1; }
message SearchProductsResponse { repeated Product products = 1; }
message UpdatePriceRequest { string sku = 1; double price = 2; }
message UpdatePriceResponse { bool success = 1; }
message BulkGetProductsRequest { repeated string sku = 1; }
message BulkGetProductsResponse { repeated Product products = 1; }
message DeleteProductRequest { string sku = 1; }
message DeleteProductResponse { bool success = 1; }
message ListProductsRequest { int32 limit = 1; int32 offset = 2; }
message ListProductsResponse { repeated Product products = 1; }
message UpsertProductRequest { Product product = 1; }
message UpsertProductResponse { bool created = 1; }
message BatchUpdatePriceItem { string sku = 1; double price = 2; }
message BatchUpdatePriceRequest { repeated BatchUpdatePriceItem items = 1; }
message BatchUpdatePriceResponse { int32 updated = 1; }
message GetProductsByPriceRangeRequest { double min_price = 1; double max_price = 2; }
message GetProductsByPriceRangeResponse { repeated Product products = 1; }
message AdjustPriceByPercentRequest { string sku = 1; double percent = 2; }
message AdjustPriceByPercentResponse { bool success = 1; double new_price = 2; }
message GetCatalogStatsRequest {}
message GetCatalogStatsResponse { int32 total_products = 1; double average_price = 2; }
service CatalogService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);
  rpc UpdatePrice(UpdatePriceRequest) returns (UpdatePriceResponse);
  rpc BulkGetProducts(BulkGetProductsRequest) returns (BulkGetProductsResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc UpsertProduct(UpsertProductRequest) returns (UpsertProductResponse);
  rpc BatchUpdatePrice(BatchUpdatePriceRequest) returns (BatchUpdatePriceResponse);
  rpc GetProductsByPriceRange(GetProductsByPriceRangeRequest) returns (GetProductsByPriceRangeResponse);
  rpc AdjustPriceByPercent(AdjustPriceByPercentRequest) returns (AdjustPriceByPercentResponse);
  rpc GetCatalogStats(GetCatalogStatsRequest) returns (GetCatalogStatsResponse);
}
