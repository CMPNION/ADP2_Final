x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: pass

services:
  postgres_inventory:
    image: postgres:15
    environment:
      <<: *postgres-env
      POSTGRES_DB: inventory_db
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_catalog:
    image: postgres:15
    environment:
      <<: *postgres-env
      POSTGRES_DB: catalog_db
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_order:
    image: postgres:15
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_db
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_identity:
    image: postgres:15
    environment:
      <<: *postgres-env
      POSTGRES_DB: identity_db
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2
    ports: ["4222:4222"]

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    depends_on: [postgres_inventory, redis, nats]
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres_inventory:5432/inventory_db?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      GRPC_ADDR: :50051
      METRICS_ADDR: :9090
    ports: ["50051:50051"]
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    depends_on: [postgres_catalog, nats]
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres_catalog:5432/catalog_db?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8081
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    depends_on: [postgres_order, nats, inventory-service]
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres_order:5432/order_db?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8082
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on: [postgres_identity, nats]
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres_identity:5432/identity_db?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8083
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on: [inventory-service, catalog-service, order-service, notification-service]
    environment:
      HTTP_ADDR: :8080
      INVENTORY_GRPC_ADDR: inventory-service:50051
      JWT_SECRET: dev-jwt-secret
      RATE_LIMIT_PER_MINUTE: 120
    ports: ["8080:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      JWT_SECRET: dev-jwt-secret
      HTTP_ADDR: :8090
    ports: ["8090:8090"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
