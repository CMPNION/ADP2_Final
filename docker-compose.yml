x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: pass

services:
  postgres_inventory:
    image: postgres:15
    environment:
      <<: *postgres-env
      POSTGRES_DB: inventory_db
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_catalog:
    image: postgres:15
    environment:
      <<: *postgres-env
      POSTGRES_DB: catalog_db
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_order:
    image: postgres:15
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_db
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_identity:
    image: postgres:15
    environment:
      <<: *postgres-env
      POSTGRES_DB: identity_db
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2
    ports: ["4222:4222"]

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    depends_on: [postgres_inventory, redis, nats]
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres_inventory:5432/inventory_db?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      GRPC_ADDR: :50051
      METRICS_ADDR: :9090
    ports: ["50051:50051"]
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    depends_on: [postgres_catalog, nats]
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres_catalog:5432/catalog_db?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8081
      GRPC_ADDR: :50052
    ports: ["8081:8081", "50052:50052"]
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    depends_on: [postgres_order, nats, inventory-service]
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres_order:5432/order_db?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8082
      GRPC_ADDR: :50053
    ports: ["8082:8082", "50053:50053"]
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on: [postgres_identity, nats]
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres_identity:5432/identity_db?sslmode=disable
      NATS_URL: nats://nats:4222
      METRICS_ADDR: :8083
      NOTIFICATION_MODE: log
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on: [inventory-service, catalog-service, order-service, notification-service]
    environment:
      HTTP_ADDR: :8080
      METRICS_ADDR: :9095
      INVENTORY_GRPC_ADDR: inventory-service:50051
      JWT_SECRET: dev-jwt-secret
      RATE_LIMIT_PER_MINUTE: 120
    ports: ["8080:8080", "9095:9095"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on: [postgres_identity]
    environment:
      JWT_SECRET: dev-jwt-secret
      HTTP_ADDR: :8090
      DATABASE_URL: postgres://postgres:pass@postgres_identity:5432/identity_db?sslmode=disable
    ports: ["8090:8090"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on: [api-gateway, auth-service]
    ports: ["3000:80"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    depends_on: [api-gateway, inventory-service, catalog-service, order-service, auth-service, notification-service, alertmanager]
    volumes:
      # Prometheus configuration and alert rules are mounted read-only for demo reproducibility.
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports: ["9091:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      # Alertmanager receives Prometheus alerts and keeps the demo alert flow visible.
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports: ["9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/omnichannel.json
    volumes:
      # Grafana provisioning loads the Prometheus datasource and dashboard automatically.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
